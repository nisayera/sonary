name: Sonary
options:
  bundleIdPrefix: app.sonary
  deploymentTarget:
    macOS: "26.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.4
  SonaryCore:
    path: Packages/SonaryCore
  SonaryUI:
    path: Packages/SonaryUI
  Monitor:
    path: Packages/Monitor
  Mouse:
    path: Packages/Mouse
  Notch:
    path: Packages/Notch
  Clipboard:
    path: Packages/Clipboard
  Apps:
    path: Packages/Apps
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: 600
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Sonary:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: SonaryCore
      - package: SonaryUI
      - package: Monitor
      - package: Mouse
      - package: Notch
      - package: Clipboard
      - package: Apps
      - package: Sparkle
        product: Sparkle
    entitlements:
      path: App/Sonary.entitlements
      properties:
        com.apple.security.cs.disable-library-validation: true
        com.apple.security.automation.apple-events: true
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Sonary
        CFBundleDisplayName: Sonary
        LSUIElement: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: https://github.com/nisayera/sonary/releases/latest/download/appcast.xml
        SUPublicEDKey: nOzXdHJRORv/XYR8k+04/MHvpxSBO13KaP7gO4UHLVw=
        SUEnableAutomaticChecks: true
        NSAppleEventsUsageDescription: "Sonary controls Music and Spotify from the notch and runs the Finder helpers you click."
        NSCalendarsFullAccessUsageDescription: "Sonary shows today's events in the notch when you turn on the calendar widget."
        NSDownloadsFolderUsageDescription: "Sonary shows your newest downloads in the notch."
        NSHumanReadableCopyright: "GPL-3.0-or-later"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sonary.Sonary
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  SonaryTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SonaryTests
    dependencies:
      - target: Sonary
      - package: SonaryCore
      - package: Monitor
      - package: Mouse
      - package: Notch
      - package: Clipboard
      - package: Apps
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.sonary.SonaryTests
schemes:
  Sonary:
    build:
      targets:
        Sonary: all
    test:
      targets:
        - SonaryTests
