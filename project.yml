name: Sonary
options:
  bundleIdPrefix: app.sonary
  deploymentTarget:
    macOS: "26.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.4
  SonaryCore:
    path: Packages/SonaryCore
  SonaryUI:
    path: Packages/SonaryUI
  Monitor:
    path: Packages/Monitor
  Mouse:
    path: Packages/Mouse
  Notch:
    path: Packages/Notch
  Clipboard:
    path: Packages/Clipboard
  Apps:
    path: Packages/Apps
  Windows:
    path: Packages/Windows
  Sound:
    path: Packages/Sound
  Tools:
    path: Packages/Tools
  Keyboard:
    path: Packages/Keyboard
  Display:
    path: Packages/Display
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    MARKETING_VERSION: "0.44.1"
    CURRENT_PROJECT_VERSION: 4401
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Sonary:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: SonaryCore
      - package: SonaryUI
      - package: Monitor
      - package: Mouse
      - package: Notch
      - package: Clipboard
      - package: Apps
      - package: Windows
      - package: Sound
      - package: Tools
      - package: Keyboard
      - package: Display
      - package: Sparkle
        product: Sparkle
    entitlements:
      path: App/Sonary.entitlements
      properties:
        com.apple.security.cs.disable-library-validation: true
        com.apple.security.automation.apple-events: true
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Sonary
        CFBundleDisplayName: Sonary
        LSUIElement: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: https://github.com/nisayera/sonary/releases/latest/download/appcast.xml
        SUPublicEDKey: nOzXdHJRORv/XYR8k+04/MHvpxSBO13KaP7gO4UHLVw=
        SUEnableAutomaticChecks: true
        NSAppleEventsUsageDescription: "Sonary controls Music and Spotify from the notch and runs the Finder helpers you click."
        NSCalendarsFullAccessUsageDescription: "Sonary shows today's events in the notch when you turn on the calendar widget."
        NSDownloadsFolderUsageDescription: "Sonary shows your newest downloads in the notch."
        NSCameraUsageDescription: "Sonary shows a small camera preview when you turn it on from the tools tab."
        NSMicrophoneUsageDescription: "Sonary shows the microphone level in the sound tab, and records the microphone with the screen when you turn that on."
        NSHumanReadableCopyright: "GPL-3.0-or-later"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sonary.Sonary
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  SonaryTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SonaryTests
    dependencies:
      - target: Sonary
      - package: SonaryCore
      - package: Monitor
      - package: Mouse
      - package: Notch
      - package: Clipboard
      - package: Apps
      - package: Windows
      - package: Sound
      - package: Tools
      - package: Keyboard
      - package: Display
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.sonary.SonaryTests
schemes:
  Sonary:
    build:
      targets:
        Sonary: all
    test:
      targets:
        - SonaryTests
