<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonary: a drawer of Mac utilities behind one menu bar icon</title>
<meta name="description" content="Sonary is a free, open-source menu bar toolbox for macOS 26. Try it in the browser, then download it.">
<meta property="og:title" content="Sonary: your Mac's menu bar toolbox">
<meta property="og:description" content="Twelve modules behind one menu bar icon. Try the live demo in your browser. Free, open source, no account.">
<meta property="og:image" content="img/og.png">
<meta name="theme-color" content="#0e0b10">
<link rel="icon" href="img/icon-256.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: the whole page is a Mac desktop, as on vorssaint.com and theboring.name.
   Sonary's panel, settings and island are redrawn from the app's own CI snapshots:
   near-black surfaces, 12 pt cards, coral gradient badges, capsule switches. */
:root{
  color-scheme:dark;
  --accent-2:#ff4d9e; --accent-3:#ff943d;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --mac:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0e0b10;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--a);outline-offset:2px;border-radius:6px}
.stage{position:fixed;inset:0;overflow:hidden}
.desk{position:absolute;left:0;top:0;transform-origin:0 0;font-family:var(--mac);font-size:13px;line-height:1.3;color:#fff;user-select:none;overflow:hidden;
  --a:#ff6b73;--a-hi:#ff9a9f;
  --win:#1e1e1e;--side:#252525;--card:#262626;--ctl:#333336;--line:rgba(255,255,255,.075);--tx:#f2f2f3;--sub:#9d9da2;--pan:rgba(28,28,30,.86)}
.desk.lightui{--win:#f3f3f5;--side:#e9e9ec;--card:#fff;--ctl:#e3e3e8;--line:rgba(0,0,0,.08);--tx:#1c1c1e;--sub:#6c6c72;--pan:rgba(246,246,248,.86)}
.desk.solid{--pan:#1c1c1e}.desk.solid.lightui{--pan:#f6f6f8}
.desk.frosted{--pan:rgba(28,28,30,.95)}.desk.frosted.lightui{--pan:rgba(246,246,248,.95)}
.wall{position:absolute;inset:0;background:
  radial-gradient(900px 520px at 78% 108%,rgba(255,148,61,.75),transparent 62%),
  radial-gradient(760px 520px at 18% 112%,rgba(255,77,158,.6),transparent 60%),
  radial-gradient(600px 400px at 50% -10%,rgba(120,90,220,.45),transparent 65%),
  linear-gradient(#17122a,#2a1530 55%,#4a1c3a)}
.desk.lightui .wall{filter:saturate(1.1) brightness(1.55)}
.sonar{position:absolute;left:50%;top:58%;width:1700px;height:1700px;margin:-850px;border-radius:50%;
  background:repeating-radial-gradient(circle,transparent 0 84px,rgba(255,255,255,.06) 84px 85px),
   linear-gradient(rgba(255,255,255,.05),rgba(255,255,255,.05)) center/1px 100% no-repeat,
   linear-gradient(rgba(255,255,255,.05),rgba(255,255,255,.05)) center/100% 1px no-repeat}
.sonar::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0 322deg,rgba(255,107,115,.22) 346deg,rgba(255,77,158,.42) 360deg);animation:sweep 14s linear infinite}
.sonar::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:var(--a)}
@keyframes sweep{to{transform:rotate(360deg)}}
.motto{position:absolute;left:34px;bottom:112px;max-width:11.5em;font:800 58px/.96 var(--display);letter-spacing:-.035em;color:rgba(255,255,255,.93);text-wrap:balance;margin:0;pointer-events:none}
.motto em{font-style:normal;background:linear-gradient(100deg,var(--accent-3),var(--a) 50%,var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.motto small{display:block;font:500 13px/1.4 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-top:16px}
.dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:95;transition:opacity .2s}
svg{flex:none}

/* menu bar */
.mbar{position:absolute;left:0;right:0;top:0;height:30px;display:flex;align-items:center;padding:0 12px;gap:16px;background:rgba(20,14,24,.38);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);z-index:40}
.mbar .app{font-weight:700}.mbar .sp{flex:1}
.mbar .right{display:flex;align-items:center;gap:11px}
.mbtn{background:none;border:0;padding:3px 6px;border-radius:6px;display:flex;align-items:center;gap:6px;color:#fff}
.mbtn:hover,.mbtn.on{background:rgba(255,255,255,.18)}
.mbtn svg{width:17px;height:17px}.mbtn.txt{font:500 12.5px var(--mac)}.mbtn.txt svg{width:14px;height:14px}
.readout{font-variant-numeric:tabular-nums;font-size:11.5px;display:flex;gap:10px;align-items:center}
.readout i{font-style:normal;opacity:.6;margin-right:3px}
.rec{display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;font-size:11.5px;background:#e5383b;border:0;border-radius:6px;padding:2px 7px;color:#fff}
.rec::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff}

/* island */
.island{position:absolute;top:0;left:50%;transform:translateX(-50%);width:196px;height:30px;background:#000;border-radius:0 0 14px 14px;z-index:60;transition:width .42s cubic-bezier(.3,1.25,.4,1),height .42s cubic-bezier(.3,1.25,.4,1),border-radius .3s}
.island[hidden]{display:none}
.island::before,.island::after{content:"";position:absolute;top:0;width:8px;height:8px}
.island::before{left:-8px;background:radial-gradient(circle at 0 100%,transparent 7.5px,#000 8px)}
.island::after{right:-8px;background:radial-gradient(circle at 100% 100%,transparent 7.5px,#000 8px)}
.island.live:not(.open){width:280px}
.island.open{width:640px;height:190px;border-radius:0 0 24px 24px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.isl-closed{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 10px;opacity:0;transition:opacity .2s;font-size:11.5px;font-variant-numeric:tabular-nums}
.island.live:not(.open) .isl-closed{opacity:1}
.mini-cover{width:20px;height:20px;border-radius:5px}
.bars{display:flex;gap:2px;align-items:center;height:14px}
.bars span{width:2.5px;height:100%;border-radius:2px;background:var(--a);animation:bar .9s ease-in-out infinite}
.bars span:nth-child(2){animation-delay:-.3s}.bars span:nth-child(3){animation-delay:-.6s}.bars span:nth-child(4){animation-delay:-.15s}
.paused .bars span{animation-play-state:paused;transform:scaleY(.35)}
@keyframes bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.isl-open{position:absolute;inset:0;padding:4px 22px 14px;opacity:0;pointer-events:none;transition:opacity .18s;display:flex;flex-direction:column}
.island.open .isl-open{opacity:1;pointer-events:auto;transition:opacity .3s .14s}
.isl-head{height:32px;display:flex;align-items:center;justify-content:space-between}
.tabs{display:flex;border-radius:99px}
.tabs button{border:0;background:none;height:26px;padding:0 15px;color:#8a8a8e;border-radius:99px;display:flex;align-items:center}
.tabs button.on{background:rgba(120,120,128,.32);color:#fff}
.tabs svg,.isl-stat svg{width:15px;height:15px}
.isl-stat{display:flex;align-items:center;gap:8px;font-size:13px}
.isl-stat button{background:none;border:0;display:flex;padding:4px}
.batt{width:26px;height:12px;border:1.5px solid rgba(255,255,255,.5);border-radius:4px;padding:1.5px;position:relative}
.batt i{display:block;height:100%;background:#fff;border-radius:1.5px}
.batt::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:rgba(255,255,255,.5);border-radius:0 2px 2px 0}
.isl-body{flex:1;display:flex;gap:15px;padding-top:8px;min-height:0}
.player{flex:1;display:flex;gap:14px;align-items:center;min-width:0}
.cover{width:104px;height:104px;border-radius:13px;flex:none;position:relative;transition:transform .3s,filter .3s;border:0;padding:0}
.cover::before{content:"";position:absolute;inset:-6px;border-radius:20px;background:inherit;filter:blur(26px);opacity:.55;z-index:-1}
.paused .cover{transform:scale(.86);filter:brightness(.55)}
.pinfo{flex:1;min-width:0}
.pinfo .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo .ar{font-size:15px;font-weight:500;color:var(--a);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slider{height:5px;border-radius:3px;background:rgba(140,140,140,.3);margin:10px 0 4px;cursor:pointer;overflow:hidden}
.slider i{display:block;height:100%;background:var(--a)}
.times{display:flex;justify-content:space-between;font-size:11px;color:#8a8a8e;font-variant-numeric:tabular-nums}
.ctrl{display:flex;justify-content:center;gap:16px;margin-top:2px}
.ctrl button{background:none;border:0;width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.ctrl button:hover{background:rgba(140,140,140,.22)}
.ctrl svg{width:17px;height:17px}.ctrl .pp svg{width:25px;height:25px}
.cal{width:215px;flex:none;display:flex;flex-direction:column}
.cal-top{display:flex;gap:8px}
.cal-top .m{font-size:17px;font-weight:600;line-height:1.15}.cal-top .y{font-size:17px;font-weight:300;color:#a6a6a6}
.wheel{display:flex;overflow-x:auto;scrollbar-width:none;flex:1;-webkit-mask:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);padding:0 10px}
.wheel::-webkit-scrollbar{display:none}
.wheel button{border:0;background:none;padding:4px;border-radius:8px;min-width:32px;display:flex;flex-direction:column;gap:6px;align-items:center;color:#a6a6a6;font-size:11px}
.wheel button b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:500}
.wheel button.today b{background:var(--a);color:#fff}
.wheel button.sel{background:color-mix(in srgb,var(--a) 26%,transparent);color:#fff}
.events{flex:1;overflow:auto;margin-top:6px;font-size:12.5px}
.ev{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid rgba(140,140,140,.18)}
.ev i{width:3px;height:16px;border-radius:2px;background:var(--a)}.ev span{margin-left:auto;color:#a6a6a6;font-size:11px}
.free{text-align:center;color:#a6a6a6;font-size:11.5px;padding-top:10px}.free b{display:block;color:#fff;font-weight:400;font-size:12.5px}
.shelf{flex:1;border:1.5px dashed rgba(255,255,255,.22);border-radius:14px;display:grid;place-items:center;color:#a6a6a6;text-align:center;font-size:12.5px}
.secs{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-content:start}
.secs button{border:0;background:rgba(255,255,255,.08);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;gap:6px;align-items:center;font-size:11.5px}
.secs button:hover{background:rgba(255,255,255,.16)}.secs svg{width:19px;height:19px;color:var(--a)}
.ipage{flex:1;display:flex;flex-direction:column;gap:8px;justify-content:center;font-size:12.5px}
.ipage .bigt{font:700 44px var(--mac);font-variant-numeric:tabular-nums;text-align:center}
.ipage .rowx{display:flex;gap:10px;align-items:center}.ipage .rowx span:first-child{flex:1}
.ib{border:0;background:rgba(255,255,255,.12);border-radius:99px;padding:5px 14px;font-size:12px}.ib:hover{background:rgba(255,255,255,.22)}

/* windows */
.win{position:absolute;border-radius:14px;overflow:hidden;z-index:10;display:flex;flex-direction:column;color:var(--tx);background:var(--win);border:1px solid rgba(255,255,255,.14);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.win.front{z-index:20;box-shadow:0 30px 80px rgba(0,0,0,.62)}
.win[hidden]{display:none}
.tbar{height:38px;display:flex;align-items:center;padding:0 13px;gap:8px;cursor:grab;flex:none}
.tbar .ttl{flex:1;text-align:center;font-weight:600;font-size:13px;opacity:.8;margin-right:52px}
.lights{display:flex;gap:8px}
.lights button{width:12px;height:12px;border-radius:50%;border:0;padding:0;background:#ff5f57}
.lights button:nth-child(2){background:#febc2e}.lights button:nth-child(3){background:#28c840}
.win:not(.front) .lights button{background:#5a5560}
.wbody{flex:1;overflow:auto;min-height:0}
.note{padding:6px 22px 18px;font-size:14px;line-height:1.55;user-select:text}
.note h3{font-size:21px;margin:0 0 10px;font-weight:700}.note li{margin:5px 0}.note ul{padding-left:20px;margin:8px 0}
kbd{font-family:var(--mono);font-size:11.5px;background:var(--ctl);border-radius:5px;padding:1px 6px}
.snap{position:absolute;border-radius:14px;background:color-mix(in srgb,var(--a) 22%,transparent);border:2px solid var(--a);z-index:9;display:none;transition:all .12s}
.pad{display:flex;flex-direction:column;height:100%}
.pad .ptab{display:flex;gap:4px;padding:0 10px 6px}
.pad textarea{flex:1;background:none;border:0;outline:0;resize:none;color:var(--tx);font:13px/1.5 var(--mono);padding:8px 14px}

/* shared Sonary controls (from the app's snapshots) */
.badge{width:26px;height:26px;border-radius:7.5px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(160deg,var(--a-hi),var(--a))}
.badge svg{width:15px;height:15px}
.badge.off{background:var(--ctl);color:var(--sub)}
.sw{width:42px;height:22px;border-radius:99px;border:0;background:#4b4b50;position:relative;flex:none;padding:0;transition:background .2s}
.lightui .sw{background:#cfcfd4}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:26px;height:18px;border-radius:99px;background:#e9e9ea;transition:transform .2s}
.sw.on{background:var(--a)}.sw.on::after{transform:translateX(12px);background:#fff}
.sw.sm{width:34px;height:18px}.sw.sm::after{width:20px;height:14px}.sw.sm.on::after{transform:translateX(10px)}
.pbtn{border:0;background:var(--ctl);border-radius:7px;padding:4px 11px;font-size:12px;font-weight:500;color:var(--tx);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.pbtn:hover{filter:brightness(1.25)}.pbtn svg{width:13px;height:13px}
.pbtn.link{background:none;color:#3b9bff}
.kc{font:600 12px var(--mono);background:var(--ctl);border-radius:7px;padding:4px 0;width:108px;text-align:center}
.kc.rec1{outline:2px solid var(--a)}
.dot{width:6px;height:6px;border-radius:50%;background:#77777c;display:inline-block;margin-right:5px}.dot.g{background:#30d158}
.chev{color:var(--a);opacity:.7;width:12px;height:12px}
select.sel{appearance:none;-webkit-appearance:none;background:var(--ctl);color:var(--tx);border:0;border-radius:7px;padding:4px 24px 4px 11px;font:500 12.5px var(--mac);
  background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 12px) 55%,calc(100% - 8px) 55%;background-size:4px 4px;background-repeat:no-repeat}
input[type=range]{accent-color:var(--a);width:120px}

/* settings window */
.set{display:flex;height:100%;background:var(--win)}
.side{width:206px;background:var(--side);padding:6px 8px 10px;display:flex;flex-direction:column;gap:1px;flex:none;overflow:auto;border-radius:10px;margin:0 0 8px 8px}
.side input{background:var(--ctl);border:0;border-radius:99px;padding:5px 11px;color:var(--tx);font:12.5px var(--mac);outline:0;margin:2px 2px 6px}
.side button{border:0;background:none;text-align:left;padding:5px 9px;border-radius:7px;display:flex;gap:9px;align-items:center;font-size:13px;color:var(--tx)}
.side button svg{width:16px;height:16px;color:var(--a)}
.side button.on{background:var(--a);color:#fff}.side button.on svg{color:#fff}
.side button .dot{margin:0 0 0 auto}
.side small{font-size:11px;font-weight:600;color:var(--sub);padding:10px 9px 3px}
.page{flex:1;overflow:auto;min-width:0}
.pin{max-width:660px;margin:0 auto;padding:6px 26px 30px}
.phd{display:flex;gap:14px;align-items:center;margin:8px 0 16px}
.phd .big{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,var(--a-hi),var(--a));flex:none;box-shadow:0 4px 14px color-mix(in srgb,var(--a) 35%,transparent)}
.phd .big svg{width:25px;height:25px}
.phd h4{margin:0;font-size:17px}.phd p{margin:1px 0 0;color:var(--sub);font-size:11.5px}
.phd .tx{flex:1}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:-4px 0 8px}
.pills button{border:0;background:var(--ctl);border-radius:99px;padding:5px 12px;font-size:12px;white-space:nowrap;color:var(--tx)}
.pills button.on{background:var(--a);color:#fff;font-weight:600}
.starrow{display:flex;gap:8px;align-items:center;font-size:12px;background:none;border:0;padding:2px 0 10px;color:var(--tx)}.starrow svg{width:15px;height:15px;color:var(--sub)}.starrow.on svg{color:#ffd60a}
.pdiv{border-top:1px solid var(--line);margin:0 -26px 14px}
.ct{font-weight:700;font-size:13px;margin:16px 4px 7px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 13px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);min-height:44px}
.row:last-child{border-bottom:0}
.row .tx{flex:1;min-width:0;font-weight:500}.row .tx small{display:block;color:var(--sub);font-size:11px;font-weight:400;margin-top:1px}
.row.note{min-height:0;color:var(--sub);font-size:11px;padding:8px 0}
.swatches{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.swatches button{width:19px;height:19px;border-radius:50%;border:0;padding:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.swatches button.on{outline:2px solid var(--tx);outline-offset:2px}
.seg{display:inline-flex;background:var(--ctl);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:3px 14px;border-radius:6px;font-size:12.5px;color:var(--tx)}.seg button.on{background:rgba(128,128,128,.45);font-weight:600}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:10px 0}
.chips button{border:0;background:var(--ctl);border-radius:8px;padding:7px 10px;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--tx);text-align:left}
.chips button::before{content:"";width:11px;height:11px;border-radius:50%;border:1.5px solid var(--sub);flex:none}
.chips button.on::before{background:var(--a);border-color:var(--a)}
.chips svg{width:14px;height:14px;color:var(--sub)}
.mbprev{background:#050505;border-radius:8px;height:30px;display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:0 14px;color:#fff;font-size:11.5px;margin:4px 0 12px}
.mbprev svg{width:15px;height:15px}
.bar{height:6px;border-radius:3px;background:var(--ctl);overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--a);transition:width .8s}

/* menu bar panel */
.panel{position:absolute;top:34px;width:332px;border-radius:16px;z-index:50;padding:12px;display:none;color:var(--tx);background:var(--pan);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 50px rgba(0,0,0,.5);max-height:calc(100% - 50px);overflow:auto;scrollbar-width:none}
.panel::-webkit-scrollbar{display:none}
.panel.show{display:block;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.ph{display:flex;align-items:center;gap:10px;margin:4px 2px 12px}
.ph img{width:30px;height:30px}
.ph b{font-size:13.5px;display:block}.ph small{color:var(--sub);font-size:11px}
.ph .clk{margin-left:auto;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.ptabs{display:flex;gap:3px;padding:3px;border-radius:11px;background:rgba(128,128,128,.14);border:1px solid var(--line);margin-bottom:12px}
.ptabs button{flex:1;border:0;background:none;border-radius:8px;height:28px;display:grid;place-items:center;color:var(--sub)}
.ptabs button.on{background:linear-gradient(180deg,var(--a-hi),var(--a));color:#fff;box-shadow:0 2px 8px color-mix(in srgb,var(--a) 40%,transparent)}
.ptabs svg{width:16px;height:16px}
.lbl{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin:10px 4px 7px}
.lbl span{color:var(--a)}
.lbl button{background:none;border:0;padding:0;display:flex;gap:5px;align-items:center;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
.pg{background:rgba(128,128,128,.13);border:1px solid var(--line);border-radius:11px;padding:0 10px;margin-bottom:8px}
.pg .row{min-height:38px;padding:6px 0;gap:10px}.pg .row .tx{font-weight:600}.pg .row .tx small{font-weight:400}
.pg .badge{width:22px;height:22px;border-radius:6.5px}.pg .badge svg{width:13px;height:13px}
.pg .li{width:22px;display:grid;place-items:center;color:var(--a)}.pg .li svg{width:19px;height:19px}
.dis{display:flex;align-items:center;gap:10px;width:100%;border:0;background:rgba(128,128,128,.13);border:1px solid var(--line);border-radius:11px;padding:7px 10px;margin-bottom:8px;font-weight:700;color:var(--tx);text-align:left}
.dis span{margin-left:auto;color:var(--a);font-size:11px;font-weight:700}.dis svg.chev{color:var(--sub)}
.pfoot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.pfoot button{border:1px solid var(--line);background:rgba(128,128,128,.13);border-radius:8px;padding:5px;font-weight:600;font-size:12px;display:flex;gap:7px;justify-content:center;align-items:center;color:var(--tx)}
.pfoot svg{width:13px;height:13px;color:var(--sub)}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin-bottom:6px}
.ring{position:relative;width:46px;height:46px;margin:0 auto 3px}
.ring svg{width:46px;height:46px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}.ring .bg{stroke:rgba(128,128,128,.25)}.ring .fg{stroke:var(--a);stroke-linecap:round;transition:stroke-dashoffset .8s}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums}
.rings small{font-size:10px;color:var(--sub);font-weight:500}
.spark{width:100%;height:46px;display:block}
.num{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.grid2 .pg{margin:0;padding:9px 10px}
.tchips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px 0 8px}
.tchips button{border:0;background:var(--ctl);border-radius:99px;padding:4px 0;font-size:12px;font-weight:600;color:var(--tx)}
.tchips button.on{background:var(--a);color:#fff}
.lay{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:2px 0 9px}
.lay button{border:0;background:var(--ctl);border-radius:6px;height:26px;position:relative}
.lay button i{position:absolute;background:var(--a);border-radius:2px}
.warn{color:#ff9f0a;font-size:11px;font-weight:500}

/* overlays */
.glass{background:var(--pan);color:var(--tx);-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);border:1px solid rgba(255,255,255,.14);box-shadow:0 18px 50px rgba(0,0,0,.45)}
.veil{position:absolute;inset:0;z-index:70;display:none;align-items:flex-start;justify-content:center}
.veil.show{display:flex}
.cmd{margin-top:150px;width:520px;border-radius:18px;overflow:hidden;animation:pop .16s ease-out}
.cmd input{width:100%;background:none;border:0;outline:0;color:var(--tx);font:500 19px var(--mac);padding:16px 18px}
.cmd ul{list-style:none;margin:0;padding:6px;border-top:1px solid var(--line);max-height:290px;overflow:auto}
.cmd li{padding:8px 11px;border-radius:9px;display:flex;gap:10px;align-items:center;cursor:pointer}
.cmd li svg{width:16px;height:16px;color:var(--a)}
.cmd li.on{background:var(--a);color:#fff}.cmd li.on svg{color:#fff}
.cmd li small{margin-left:auto;opacity:.6;font-family:var(--mono);font-size:11px}
.sheet{margin-top:70px;width:min(940px,calc(100% - 60px));max-height:calc(100% - 190px);border-radius:22px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;animation:pop .16s ease-out}
.sh-head{display:flex;align-items:center;gap:10px}
.sh-head b{font-size:15px;display:block}.sh-head small{color:var(--sub);font-size:11px}
.sh-head .hint{margin-left:auto;color:var(--sub);font-size:11px}
.sh-head input{margin-left:auto;background:var(--ctl);border:0;border-radius:99px;padding:5px 12px;color:var(--tx);font:12px var(--mac);outline:0;width:170px}
.sh-cols{column-width:190px;column-gap:20px;overflow:auto}
.sh-g{break-inside:avoid;margin-bottom:14px}
.sh-g h6{margin:0 0 4px;font-size:11px;text-transform:uppercase;color:var(--a);letter-spacing:.03em}
.sh-g button{display:flex;width:100%;border:0;background:none;padding:2.5px 0;font-size:12px;gap:6px;align-items:center;text-align:left;color:var(--tx)}
.sh-g button:hover{color:var(--a)}
.sh-g button span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-g button.star span::before{content:"★ ";color:#ffd60a}
.float{position:absolute;z-index:65;border-radius:18px;padding:12px;animation:pop .16s ease-out}
.qp{display:grid;grid-template-columns:repeat(4,64px);gap:8px}
.qp button{border:0;background:rgba(128,128,128,.16);border-radius:12px;height:58px;display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;font-size:10px;color:var(--tx)}
.qp button:hover{background:var(--a);color:#fff}.qp button:hover svg{color:#fff}.qp svg{width:19px;height:19px;color:var(--a)}
.radial{position:absolute;z-index:66;width:270px;height:270px;border-radius:50%;animation:pop .16s ease-out}
.radial button{position:absolute;width:58px;height:58px;margin:-29px;border-radius:50%;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;color:var(--tx)}
.radial button:hover{background:var(--a);color:#fff}.radial button:hover svg{color:#fff}.radial svg{width:20px;height:20px;color:var(--a)}
.radial .hub{left:50%;top:50%;width:74px;height:74px;margin:-37px;background:rgba(128,128,128,.2)}
.cliplist{width:330px}.cliplist .row{cursor:pointer;min-height:34px}.cliplist .row:hover .tx{color:var(--a)}
.swt{display:flex;gap:14px;margin-top:210px;border-radius:20px;padding:16px;animation:pop .16s ease-out}
.swt button{border:0;background:none;display:flex;flex-direction:column;gap:8px;align-items:center;font-size:12px;border-radius:12px;padding:8px;color:var(--tx)}
.swt button.on,.swt button:hover{background:rgba(128,128,128,.25)}
.swt i{display:block;width:170px;height:104px;border-radius:9px;background:var(--win);border:1px solid rgba(255,255,255,.18);position:relative;overflow:hidden}
.swt i::before{content:"";position:absolute;left:8px;top:8px;width:34px;height:7px;border-radius:4px;background:linear-gradient(90deg,#ff5f57 0 22%,transparent 22% 39%,#febc2e 39% 61%,transparent 61% 78%,#28c840 78%)}
.swt i::after{content:"";position:absolute;left:10px;right:10px;top:26px;bottom:10px;border-radius:5px;background:repeating-linear-gradient(var(--ctl) 0 6px,transparent 6px 13px)}
.cam{position:absolute;right:130px;bottom:120px;width:150px;height:150px;border-radius:50%;z-index:25;background:radial-gradient(circle at 50% 38%,#f1c7a8 0 22%,transparent 23%),radial-gradient(ellipse at 50% 105%,#3a3f55 0 46%,transparent 47%),linear-gradient(#2c3550,#161a2a);border:3px solid rgba(255,255,255,.85);box-shadow:0 12px 40px rgba(0,0,0,.5);cursor:grab}
.full{position:absolute;inset:0;z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#000;color:#fff;text-align:center;cursor:pointer}
.full.show{display:flex}
.full .bigc{font:200 96px var(--mac);font-variant-numeric:tabular-nums;line-height:1}
.full small{opacity:.55;font-size:13px}
.full.lock{background:rgba(10,8,14,.55);-webkit-backdrop-filter:blur(40px);backdrop-filter:blur(40px)}
.full.saver .sonar{top:50%}
.pick{cursor:crosshair}.pick *{cursor:crosshair!important}
.thumb{position:absolute;right:16px;bottom:96px;width:180px;border-radius:10px;overflow:hidden;z-index:64;border:2px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.5);background:linear-gradient(#17122a,#4a1c3a);height:112px;display:none;align-items:flex-end;cursor:pointer}
.thumb.show{display:flex;animation:pop .2s}
.thumb span{background:rgba(0,0,0,.6);width:100%;padding:4px 8px;font-size:10.5px}

.dock{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:9px;padding:7px 9px;border-radius:22px;z-index:30;background:rgba(40,34,46,.55);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);border:1px solid rgba(255,255,255,.14)}
.dock a{display:block}
.dock button{width:50px;height:50px;border-radius:13px;border:0;padding:0;display:grid;place-items:center;position:relative;transition:transform .15s;color:#fff}
.dock button:hover{transform:translateY(-7px) scale(1.12)}
.dock button svg{width:27px;height:27px}.dock button img{width:50px;height:50px}
.dock button.run::after{content:"";position:absolute;bottom:-5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:rgba(255,255,255,.8)}
.dock i{width:1px;background:rgba(255,255,255,.2);margin:4px 2px}
.dprev{position:absolute;bottom:78px;z-index:31;border-radius:12px;padding:8px;font-size:11px;text-align:center;display:none}
.dprev i{display:block;width:150px;height:92px;border-radius:7px;background:var(--win);border:1px solid rgba(255,255,255,.15);margin-bottom:5px;background-image:repeating-linear-gradient(var(--ctl) 0 5px,transparent 5px 12px);background-origin:content-box;padding:18px 10px 8px;background-clip:content-box}
.dicons{position:absolute;right:18px;top:56px;display:flex;flex-direction:column;gap:20px;z-index:5}
.dicons button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:5px;width:86px;padding:4px;border-radius:10px;font:500 12px/1.2 var(--mac);text-shadow:0 1px 3px rgba(0,0,0,.7);text-align:center;color:#fff}
.dicons button:hover{background:rgba(255,255,255,.12)}
.dicons .tile{width:50px;height:50px;border-radius:13px;display:grid;place-items:center}.dicons .tile svg{width:26px;height:26px}.dicons img{width:54px;height:54px}
.notif{position:absolute;top:40px;right:12px;width:340px;z-index:45;border-radius:18px;padding:12px 14px;display:flex;gap:11px;align-items:flex-start;font-size:12.5px;line-height:1.35}
.notif[hidden]{display:none}
.notif img{width:34px;height:34px;flex:none}.notif b{display:block;font-size:13px}.notif span{color:var(--sub)}.notif button{align-self:center}
.toast{position:absolute;top:44px;right:14px;z-index:80;border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;max-width:320px;font-size:12.5px;opacity:0;transform:translateX(20px);transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:none}.toast img{width:28px;height:28px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:98;pointer-events:none}.flash.go{animation:fl .45s}
@keyframes fl{0%{opacity:.75}100%{opacity:0}}
.cmdkey{position:absolute;left:14px;bottom:14px;z-index:30;border-radius:12px;padding:8px 13px;font:600 13px var(--mac);display:flex;gap:8px;align-items:center;touch-action:none}
.cmdkey kbd{font-size:15px;color:var(--a);background:none;padding:0}
.inst{padding:6px 22px 18px;font-size:13.5px;line-height:1.5;user-select:text}
.inst h3{font:800 26px/1 var(--display);letter-spacing:-.02em;margin:0 0 6px}
.inst ol{padding-left:20px;margin:10px 0}.inst li{margin:6px 0}
.inst pre{background:var(--ctl);border-radius:9px;padding:9px 11px;font:500 11.5px/1.6 var(--mono);overflow-x:auto;margin:6px 0 12px}
.inst .dl{display:inline-block;margin:10px 0 4px;padding:9px 18px;border-radius:99px;text-decoration:none;font-weight:700;color:#1a0d10;background:linear-gradient(100deg,var(--accent-3),var(--a) 45%,var(--accent-2))}
.inst small{color:var(--sub)}
@media (prefers-reduced-motion:reduce){.sonar::before,.bars span{animation:none}.island{transition:none}}
</style>
</head>

    <div class="wbody" style="overflow:hidden"><div class="set"><div class="side" id="setSide"></div><div class="page" id="setPage"></div></div></div>

    <div class="wbody"><div class="inst" id="instBody"></div></div>
  </div>
  <div class="win" id="w-pad" data-app="Sonary" style="width:340px;height:260px" hidden>

    <div class="wbody"><div class="pad"><div class="ptab"><button class="pbtn">Note</button><button class="pbtn" style="opacity:.6">Ideas</button><button class="pbtn" style="opacity:.6">+</button></div><textarea id="padText" spellcheck="false"># Scratchpad
- tabs, Markdown preview, export
- also lives in the island</textarea></div></div>
  </div>

$("#dock").addEventListener("click",function(e){var b=e.target.closest("[data-dock]");if(!b)return;var d=b.dataset.dock;$("#dprev").style.display="none";
  if(d==="notes")openWin("#w-notes");else if(d==="settings")openSettings();else if(d==="cmd")act("cmd");else if(d==="install")openSettings("install");else{front(null);toast("Finder is in front now. Hold ⌘ to see its shortcuts.|Jetzt ist der Finder vorn. ⌘ halten zeigt seine Kurzbefehle.")}});
$("#dock").addEventListener("mouseover",function(e){var b=e.target.closest("[data-w]"),p=$("#dprev");if(!b||!on("windows")||!S.dockPrev||$("#"+b.dataset.w).hidden){p.style.display="none";return}
  p.innerHTML="<i></i>"+esc($(".ttl",$("#"+b.dataset.w)).textContent);p.style.display="block";var r=b.getBoundingClientRect(),d=desk.getBoundingClientRect();p.style.left=((r.left+r.width/2-d.left)/scale-p.offsetWidth/2)+"px"});
$("#dock").addEventListener("mouseleave",function(){$("#dprev").style.display="none"});

  $("#dicons").innerHTML='<button data-ico="settings"><img src="'+ICON+'" alt="">'+t("Sonary Settings|Sonary – Einstellungen")+'</button><button data-ico="install"><span class="tile" style="background:linear-gradient(#5ac8fa,#0a84ff)">'+DL+'</span>'+t("Download Sonary|Sonary laden")+'</button><button data-ico="notes"><span class="tile" style="background:linear-gradient(#fff3b0,#ffd60a);color:#5a4500">'+ic("note")+'</span>'+t("Read me|Lies mich")+'</button>';
  $("#notesTtl").textContent=t("Notes|Notizen");$("#instTtl").textContent=t("Download Sonary|Sonary laden");$("#cmdKeyTx").textContent=t("press and hold|gedrückt halten");
  $("#langBtn").innerHTML=ic("globe")+lang.toUpperCase();
  $("#noteText").innerHTML=t(
   '<h3>Try Sonary here</h3>This desktop is a replica; the readings are made up. Things to do:<ul><li>Click the <b>radar icon</b> in the menu bar: the panel, one tab per area.</li><li>Move onto the <b>notch</b>: player, calendar, shelf, timer.</li><li>Hold <kbd>⌘</kbd> for this app\'s shortcuts.</li><li><kbd>⌥Space</kbd> command bar · <kbd>⌃⌥R</kbd> radial menu · <kbd>⌃⌥S</kbd> screenshot · <kbd>⌃⌥⇥</kbd> window switcher · <kbd>⌃⌥←</kbd> <kbd>⌃⌥→</kbd> layouts.</li><li>Drag this window to an edge.</li><li><b>Settings</b>: every module with its options, accent colour, shortcuts.</li></ul>|'+

  $("#instBody").innerHTML='<h3>'+t("Install Sonary|Sonary installieren")+'</h3><small>'+t("Beta · needs Apple Silicon and macOS 26 Tahoe|Beta · braucht Apple Silicon und macOS 26 Tahoe")+'</small><br>'+installHTML();
  var n=$("#notif");if(!n.dataset.gone)n.innerHTML='<img src="'+ICON+'" alt=""><div><b>'+t("Sonary is running|Sonary läuft")+'</b><span>'+t("This Mac is a live demo. Open Settings, switch modules on and off and watch the whole system change.|Dieser Mac ist eine Live-Demo. Öffne die Einstellungen, schalte Module an und aus und sieh zu, wie sich das ganze System ändert.")+'</span></div><button class="pbtn">'+t("Open Settings|Einstellungen")+'</button>'}
$("#dicons").addEventListener("click",function(e){var b=e.target.closest("[data-ico]");if(!b)return;var k=b.dataset.ico;if(k==="settings")openSettings("features");else if(k==="install")openWin("#w-install");else openWin("#w-notes")});
$("#notif").addEventListener("click",function(e){this.dataset.gone="1";this.hidden=true;if(e.target.closest("button"))openSettings("features")});
$("#langBtn").addEventListener("click",function(){lang=lang==="de"?"en":"de";try{localStorage.setItem("sonary-lang",lang)}catch(e){}document.documentElement.lang=lang;renderAll()});

function renderAll(){renderStatic();renderIconBtn();tick();renderBar();renderIsland();renderPanel();renderSettings();renderDock();front($(".win.front:not([hidden])")||null);if($("#sheetVeil").classList.contains("show"))renderSheet()}

setInterval(function(){
  S.cpu=Math.max(4,Math.min(92,S.cpu+(Math.random()-.5)*14));S.mem=Math.max(40,Math.min(88,S.mem+(Math.random()-.5)*2));S.temp=38+S.cpu*.3;
  S.down=Math.max(.1,S.down+(Math.random()-.5)*1.600);S.up=Math.max(.05,S.up+(Math.random()-.5)*.3);S.hist.push(S.cpu);S.hist.shift();
  S.dl=S.dl.map(function(v){return v>=100?0:Math.min(100,v+Math.random()*4)});
  if(S.rec)S.rec++;
  if(S.timerOn){S.timer--;if(S.timer<=0){S.timerOn=false;S.timer=300;toast("Timer finished|Timer abgelaufen");renderIsland()}else{var a=$("#miniT"),b=$("#bigT");if(a)a.textContent=fmt(S.timer);if(b)b.textContent=fmt(S.timer)}}
  if(S.playing){S.pos+=1;if(S.pos>=TRACKS[S.track].d){S.track=(S.track+1)%TRACKS.length;S.pos=0;renderIsland()}else drawProg()}
  if(S.islTab==="secs"&&S.islPage==="downloads"&&island.classList.contains("open"))renderIsland();
  tick();renderBar();
  if(panel.classList.contains("show")&&!panel.matches(":hover"))renderPanel();
},1000);

document.documentElement.lang=lang;fit();renderAll();
})();
