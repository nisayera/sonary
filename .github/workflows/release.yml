name: Release

# Every merge to main whose version in project.yml has no release yet is built, signed (Sparkle EdDSA)
# and published automatically. Pushing a tag like v0.3.0 (or publishing a release in the web UI) still works.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      marketing: ${{ steps.decide.outputs.marketing }}
      build: ${{ steps.decide.outputs.build }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether this version needs a release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            V=$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([0-9.]*\)"\{0,1\}.*/\1/p' project.yml | head -1)
            TAG="v$V"
          fi
          read -r MARKETING BUILD < <(python3 scripts/release_tools.py version "$TAG")
          PUBLISH=true
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
          if [ "$ASSETS" -gt 0 ]; then
            echo "Release $TAG already has its files, nothing to do."
            PUBLISH=false
          fi
          {
            echo "tag=$TAG"
            echo "marketing=$MARKETING"
            echo "build=$BUILD"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.publish == 'true'
    # The x64 pool, because the arm64 one has no capacity today. This job compiles,
    # signs and packages but never runs the app, and ARCHS stays arm64, so the host
    # architecture does not change what comes out.
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install xcodegen
          python3 -m venv .venv
          .venv/bin/pip install cryptography

      - name: Build Release app
        run: |
          set -eo pipefail
          xcodegen generate
          xcodebuild -project Sonary.xcodeproj -scheme Sonary -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            MARKETING_VERSION="${{ needs.check.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ needs.check.outputs.build }}" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES \
            build 2>&1 | tee build.log
          APP="build/Build/Products/Release/Sonary.app"
          test -d "$APP"
          GOT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          test "$GOT" = "${{ needs.check.outputs.marketing }}"
          codesign --verify --deep --strict "$APP"

      - name: Re-sign with the stable self-signed certificate
        # A fixed signing identity keeps macOS privacy permissions (Accessibility, Screen Recording, ...)
        # across updates. Ad-hoc signatures change with every build, so macOS treated each update as a new app.
        env:
          P12: ${{ secrets.SIGNING_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          CERT_SHA1: ${{ secrets.SIGNING_CERT_SHA1 }}
        run: |
          set -eo pipefail
          if [ -z "$P12" ] || [ -z "$CERT_SHA1" ]; then
            echo "::error::SIGNING_CERT_P12 / SIGNING_CERT_SHA1 secrets are missing"; exit 1
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          APP="build/Build/Products/Release/Sonary.app"
          codesign --force --deep --keychain "$KC" --sign "$CERT_SHA1" \
            --preserve-metadata=entitlements,flags "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|Identifier"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Package
        run: |
          set -eo pipefail
          V="${{ needs.check.outputs.marketing }}"
          APP="build/Build/Products/Release/Sonary.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "Sonary-$V.zip"
          mkdir dmgroot && cp -R "$APP" dmgroot/ && ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Sonary $V" -srcfolder dmgroot -ov -format UDZO "Sonary-$V.dmg"

      - name: Release notes
        run: |
          {
            echo "Sonary ${{ needs.check.outputs.marketing }}"
            echo
            echo "Install: open the DMG and drag Sonary to Applications. Requires macOS 26 on Apple silicon."
            echo "First launch: this build is not notarized yet. Right-click Sonary, choose Open, then Open again"
            echo "(or run: xattr -dr com.apple.quarantine /Applications/Sonary.app). Later updates install from inside the app."
          } > notes.md

      - name: Appcast (Sparkle update feed)
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY secret is missing: refusing to publish a release without an update feed."
            exit 1
          fi
          V="${{ needs.check.outputs.marketing }}"
          .venv/bin/python scripts/release_tools.py appcast --tag "${{ needs.check.outputs.tag }}" \
            --archive "Sonary-$V.zip" --repo "$GITHUB_REPOSITORY" --notes notes.md --out appcast.xml

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ needs.check.outputs.marketing }}"
          FILES=("Sonary-$V.zip" "Sonary-$V.dmg")
          [ -f appcast.xml ] && FILES+=(appcast.xml)
          TAG="${{ needs.check.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A release for this tag already exists (e.g. created in the web UI): fill it in and publish it.
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --title "Sonary $V" --notes-file notes.md --draft=false
          else
            gh release create "$TAG" "${FILES[@]}" --title "Sonary $V" --notes-file notes.md --target "$GITHUB_SHA"
          fi
